name: Generate Timestamped PDF Versioning
on:
  push:
    paths:
      - '**.md'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed Markdown files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: '**.md'

      - name: Install Pandoc and Weasyprint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Process, Style, and Convert
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Timestamps
          HEADER_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          FILE_TIME=$(date -u +"%Y%m%d_%H%M%S")
          
          mkdir -p pdf-versions

          # Create custom print utility overrides so code blocks/backgrounds render correctly in PDF prints
          cat << 'EOF' > print-adjustments.css
          @page {
            size: A4;
            margin: 20mm;
          }
          body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          }
          .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 10px;
          }
          /* Ensure blockquotes and code styles display with background fills */
          blockquote, pre, code {
            background-color: #f6f8fa !important;
            border-left: 0.25em solid #d0d7de !important;
          }
          EOF

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Processing $file..."
            
            # Inject timestamp directly to the Markdown document header
            sed -i "1i> **Last Exported:** $HEADER_TIME\n" "$file"
            
            filename=$(basename -- "$file")
            filename_no_ext="${filename%.*}"
            output_pdf="pdf-versions/${filename_no_ext}_${FILE_TIME}.pdf"
            
            # 1. Compile Markdown into a Standalone HTML document wrapped with web-ready classes
            # 2. Inject official GitHub Markdown themes alongside our print utility fixes
            pandoc "$file" --standalone \
              -c "https://cloudflare.com" \
              -c print-adjustments.css \
              -t html \
              | sed '/<body>/c\<body class="markdown-body">' \
              | weasyprint - "$output_pdf"
          done

      - name: Commit and Push PDFs Back to Repository
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add pdf-versions/*.pdf
          
          if git diff --staged --quiet; then
            echo "No new PDF versions to commit."
          else
            git commit -m "Automated system: Added styled GitHub layout PDFs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
