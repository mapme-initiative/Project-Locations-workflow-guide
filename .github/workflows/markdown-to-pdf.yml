name: Generate Timestamped PDF Versioning
on:
  push:
    paths:
      - '**.md'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed Markdown files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: '**.md'

      - name: Install Pandoc and Weasyprint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Process, Style, and Convert to PDF
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # 1. Establish timestamps
          HEADER_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          FILE_TIME=$(date -u +"%Y%m%d_%H%M%S")
          
          # Get absolute root path before entering loops
          ROOT_DIR=$(pwd)
          mkdir -p "$ROOT_DIR/pdf-versions"

          # 2. Generate custom print stylesheets with print rules
          cat << 'EOF' > "$ROOT_DIR/print-adjustments.css"
          @page {
            size: A4;
            margin: 20mm;
            @bottom-right {
              content: counter(page);
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              font-size: 9pt;
              color: #57606a;
            }
          }
          body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #24292f;
          }
          .admonition-box {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-left: 0.25em solid #0969da;
            background-color: #f6f8fa;
            border-radius: 6px;
          }
          .admonition-title {
            font-weight: 600;
            color: #0969da;
            margin-bottom: 4px;
          }
          pre, code {
            background-color: #f6f8fa !important;
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, monospace;
            font-size: 85%;
          }
          img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1em auto;
          }
          EOF

          # 3. Dynamic multi-file directory tracker loop
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Processing file: $file"
            
            # Isolate directory and filename details
            file_dir=$(dirname "$file")
            file_name=$(basename "$file")
            filename_no_ext="${file_name%.*}"
            
            # Define exact output path
            output_pdf="$ROOT_DIR/pdf-versions/${filename_no_ext}_${FILE_TIME}.pdf"
            
            # Switch contexts directly into the file's native subdirectory to preserve relative paths
            cd "$ROOT_DIR/$file_dir"
            
            # Create isolated scratch copy inside the directory
            cp "$file_name" temp_process.md
            
            # Injects execution runtime stamps
            sed -i "1i> **Last Exported:** $HEADER_TIME\n" temp_process.md
            
            # FIX FOR CALLOUTS: Evaluates text structures cleanly
            sed -i 's/^!!!\s*overview\s*\(.*\)$/<div class="admonition-box"><div class="admonition-title">ℹ️ \1<\/div>/g' temp_process.md
            sed -i 's/^!!!\s*warning\s*\(.*\)$/<div class="admonition-box" style="border-color:#d4a72c;"><div class="admonition-title" style="color:#b08105;">⚠️ \1<\/div>/g' temp_process.md
            sed -i 's/^!!!\s*info\s*\(.*\)$/<div class="admonition-box"><div class="admonition-title">ℹ️ \1<\/div>/g' temp_process.md

            # FIX FOR TABS: flattens structural tab collections smoothly
            sed -i 's/^===\s*tab\s*"\(.*\)"/#### 📁 \1/g' temp_process.md
            sed -i 's/^===\s*"\(.*\)"/#### 📁 \1/g' temp_process.md
            sed -i 's/^===\s*$//g' temp_process.md

            echo "Compiling document inside path contextual container..."
            
            # Run compilation directly from the source directory so images are found natively
            pandoc temp_process.md --standalone \
              --from markdown+gfm+raw_html \
              -c "https://cloudflare.com" \
              -c "$ROOT_DIR/print-adjustments.css" \
              --pdf-engine=weasyprint \
              -o "$output_pdf"
              
            rm temp_process.md
          done

      - name: Commit and Push PDFs Back to Repository
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd ${{ github.workspace }}
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add pdf-versions/*.pdf
          
          if git diff --staged --quiet; then
            echo "No new PDF versions to commit."
          else
            git commit -m "Automated system: Built corrected PDFs with relative assets and symbols resolved [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
