name: Generate Timestamped HTML Versioning
on:
  push:
    paths:
      - '**.md'

permissions:
  contents: write

jobs:
  build-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed Markdown files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: '**.md'

      - name: Install Pandoc
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Process, Style, and Convert to HTML
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          HEADER_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          FILE_TIME=$(date -u +"%Y%m%d_%H%M%S")
          
          # Create a centralized html folder
          mkdir -p html-versions

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Processing $file..."
            
            # Inject timestamp directly to the Markdown document header
            sed -i "1i> **Last Exported:** $HEADER_TIME\n" "$file"
            
            filename=$(basename -- "$file")
            filename_no_ext="${filename%.*}"
            
            # Define output destination as an HTML file
            output_html="html-versions/${filename_no_ext}_${FILE_TIME}.html"
            
            echo "Generating styled HTML: $output_html"
            
            # Compile standalone HTML web page with structural class hooks for the CSS engine
            pandoc "$file" --standalone \
              -c "https://cloudflare.com" \
              -t html \
              | sed '/<body>/c\<body class="markdown-body" style="padding: 45px; max-width: 980px; margin: 0 auto;">' \
              > "$output_html"
          done

      - name: Commit and Push HTML Back to Repository
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          git add html-versions/*.html
          
          if git diff --staged --quiet; then
            echo "No new HTML versions to commit."
          else
            git commit -m "Automated system: Added styled GitHub web layouts [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
